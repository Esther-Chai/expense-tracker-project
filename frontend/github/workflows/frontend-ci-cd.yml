# .github/workflows/frontend-ci-cd.yml
#
# Runs on every push to main that touches the frontend folder.
# 1. Validates the HTML file
# 2. Deploys to Netlify

name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'    # only triggers when frontend files change
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:

  # ── Job 1: Validate ─────────────────────────────────────────
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # html5validator checks for broken tags, missing attributes etc.
      - name: Install html5validator
        run: pip install html5validator

      - name: Validate HTML
        run: html5validator --root frontend/ --also-check-css
        continue-on-error: true   # don't block deploy on minor warnings

  # ── Job 2: Deploy to Netlify ─────────────────────────────────
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Netlify CLI
      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      # Deploy the frontend/ folder to Netlify
      # To set this up:
      #   1. netlify.com → your site → Site settings → API ID  (this is NETLIFY_SITE_ID)
      #   2. netlify.com → User settings → Applications → New access token  (this is NETLIFY_AUTH_TOKEN)
      #   3. GitHub repo → Settings → Secrets → Actions → add both secrets
      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}