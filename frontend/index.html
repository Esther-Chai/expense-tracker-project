<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
      --accent: #c8f135; --text: #f0f0f0; --muted: #666;
      --danger: #ff5c5c; --info: #35c8f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }

    header { max-width: 960px; margin: 0 auto 2rem; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 1.2rem; }
    header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
    header h1 span { color: var(--accent); }
    #total-badge { font-family: 'DM Mono', monospace; font-size: 0.85rem; background: var(--surface); border: 1px solid var(--border); padding: 0.4rem 0.9rem; border-radius: 999px; color: var(--accent); }

    .layout { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; gap: 1.5rem; align-items: start; }
    .sidebar { display: flex; flex-direction: column; gap: 1.2rem; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.3rem; }
    .card-title { font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }

    .form-group { margin-bottom: 0.8rem; }
    label { display: block; font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
    input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.85rem; padding: 0.5rem 0.7rem; border-radius: 8px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface); }

    #add-btn { width: 100%; margin-top: 0.3rem; background: var(--accent); color: #0f0f0f; border: none; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem; padding: 0.6rem; border-radius: 8px; cursor: pointer; transition: opacity 0.15s; }
    #add-btn:hover { opacity: 0.85; }

    /* Date filter */
    #form-group-date input { width: 80%; }
    .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.0rem; }
    #filter-btn { width: 100%; margin-top: 0.3rem; background: transparent; color: var(--info); border: 1px solid var(--info); font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.8rem; padding: 0.5rem; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    #filter-btn:hover { background: var(--info); color: #0f0f0f; }
    #clear-filter { width: 100%; margin-top: 0.4rem; background: transparent; color: var(--muted); border: 1px solid var(--border); font-family: 'Syne', sans-serif; font-size: 0.75rem; padding: 0.4rem; border-radius: 8px; cursor: pointer; }
    #clear-filter:hover { color: var(--text); border-color: var(--muted); }

    /* Summary */
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .summary-row:last-child { border-bottom: none; }
    .cat-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 0.5rem; }
    .summary-amount { font-family: 'DM Mono', monospace; font-size: 0.82rem; color: var(--accent); }

    /* Export */
    #export-btn { width: 100%; background: transparent; color: var(--accent); border: 1px solid var(--accent); font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.8rem; padding: 0.55rem; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    #export-btn:hover { background: var(--accent); color: #0f0f0f; }

    /* Filter bar */
    .filter-bar { display: flex; gap: 0.45rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-btn { font-family: 'Syne', sans-serif; font-size: 0.73rem; font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: #0f0f0f; border-color: var(--accent); }

    /* Expense items */
    #expense-list { display: flex; flex-direction: column; gap: 0.55rem; }
    .expense-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; display: flex; align-items: center; gap: 0.8rem; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    .cat-pill { font-size: 0.63rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 0.22rem 0.55rem; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
    .expense-info { flex: 1; min-width: 0; }
    .expense-title { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .expense-date { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .expense-amount { font-family: 'DM Mono', monospace; font-size: 0.92rem; flex-shrink: 0; }
    .action-btn { background: none; border: none; color: var(--muted); font-size: 0.9rem; cursor: pointer; padding: 0.2rem 0.35rem; border-radius: 5px; transition: color 0.15s, background 0.15s; flex-shrink: 0; }
    .action-btn:hover.edit  { color: var(--info); background: rgba(53,200,241,0.1); }
    .action-btn:hover.del   { color: var(--danger); background: rgba(255,92,92,0.1); }

    /* Edit modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-bg.hidden { display: none; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; width: 340px; }
    .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1.1rem; }
    .modal-actions { display: flex; gap: 0.6rem; margin-top: 0.8rem; }
    .modal-actions button { flex: 1; padding: 0.55rem; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.82rem; cursor: pointer; border: none; }
    #save-edit-btn  { background: var(--accent); color: #0f0f0f; }
    #cancel-edit-btn { background: transparent; color: var(--muted); border: 1px solid var(--border) !important; }

    .empty-state { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 2rem 0; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface); border: 1px solid var(--accent); color: var(--accent); font-size: 0.8rem; font-weight: 600; padding: 0.6rem 1rem; border-radius: 8px; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; z-index: 99; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .date-active { border-color: var(--info) !important; color: var(--info) !important; }

    @media (max-width: 640px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <h1>Expense <span>Tracker</span></h1>
  <div id="total-badge">Total: RM 0.00</div>
</header>

<div class="layout">
  <aside class="sidebar">

    <!-- Add Expense -->
    <div class="card">
      <div class="card-title">Add Expense</div>
      <div class="form-group"><label>Title</label><input type="text" id="title" placeholder="e.g. Lunch"/></div>
      <div class="form-group"><label>Amount (RM)</label><input type="number" id="amount" placeholder="0.00" min="0" step="0.01"/></div>
      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="Food">🍜 Food</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Bills">💡 Bills</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>
      <div class="form-group"><label>Date</label><input type="date" id="date"/></div>
      <button id="add-btn">+ Add Expense</button>
    </div>

    <!-- Date Range Filter -->
    <div class="card">
      <div class="card-title">Filter by Date</div>
      <div class="date-row">
        <div id="form-group-date"><label>From</label><input type="date" id="from-date"/></div>
        <div id="form-group-date"><label>To</label><input type="date" id="to-date"/></div>
      </div>
      <button id="filter-btn">Apply Filter</button>
      <button id="clear-filter">Clear</button>
    </div>

    <!-- Summary -->
    <div class="card">
      <div class="card-title">Summary</div>
      <div id="summary-list"><p class="empty-state">No data</p></div>
    </div>

    <!-- Export -->
    <div class="card">
      <div class="card-title">Export</div>
      <button id="export-btn">⬇ Download CSV</button>
    </div>

  </aside>

  <main>
    <div class="filter-bar">
      <button class="filter-btn active" data-cat="all">All</button>
      <button class="filter-btn" data-cat="Food">Food</button>
      <button class="filter-btn" data-cat="Transport">Transport</button>
      <button class="filter-btn" data-cat="Bills">Bills</button>
      <button class="filter-btn" data-cat="Other">Other</button>
    </div>
    <div id="expense-list"></div>
  </main>
</div>

<!-- Edit Modal -->
<div class="modal-bg hidden" id="edit-modal">
  <div class="modal">
    <h3>Edit Expense</h3>
    <input type="hidden" id="edit-id"/>
    <div class="form-group"><label>Title</label><input type="text" id="edit-title"/></div>
    <div class="form-group"><label>Amount (RM)</label><input type="number" id="edit-amount" step="0.01"/></div>
    <div class="form-group">
      <label>Category</label>
      <select id="edit-category">
        <option value="Food">🍜 Food</option>
        <option value="Transport">🚗 Transport</option>
        <option value="Bills">💡 Bills</option>
        <option value="Other">📦 Other</option>
      </select>
    </div>
    <div class="form-group"><label>Date</label><input type="date" id="edit-date"/></div>
    <div class="modal-actions">
      <button id="cancel-edit-btn">Cancel</button>
      <button id="save-edit-btn">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'http://localhost:3000';

  const CAT_STYLE = {
    food:      { color: '#f1a335', bg: 'rgba(241,163,53,0.12)' },
    transport: { color: '#35c8f1', bg: 'rgba(53,200,241,0.12)' },
    bills:     { color: '#a335f1', bg: 'rgba(163,53,241,0.12)' },
    other:     { color: '#f13576', bg: 'rgba(241,53,118,0.12)' },
  };
  function catStyle(cat) { return CAT_STYLE[cat.toLowerCase()] || CAT_STYLE.other; }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  document.getElementById('date').valueAsDate = new Date();

  // ── State ──────────────────────────────────────────────────
  let activeFilter = 'all';
  let activeDateFrom = '';
  let activeDateTo   = '';

  // ── API calls ─────────────────────────────────────────────

  async function fetchExpenses() {
    let url = `${API}/expenses?`;
    if (activeFilter !== 'all') url += `category=${activeFilter}&`;
    if (activeDateFrom) url += `from=${activeDateFrom}&`;
    if (activeDateTo)   url += `to=${activeDateTo}&`;
    const res = await fetch(url);
    return res.json();
  }

  async function fetchSummary() {
    let url = `${API}/expenses/summary?`;
    if (activeDateFrom) url += `from=${activeDateFrom}&`;
    if (activeDateTo)   url += `to=${activeDateTo}&`;
    const res = await fetch(url);
    return res.json();
  }

  async function addExpense(data) {
    const res = await fetch(`${API}/expenses`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    return res.json();
  }

  // NEW: PUT request to edit an expense
  async function editExpense(id, data) {
    const res = await fetch(`${API}/expenses/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    return res.json();
  }

  async function deleteExpense(id) {
    const res = await fetch(`${API}/expenses/${id}`, { method: 'DELETE' });
    return res.json();
  }

  // ── Render ────────────────────────────────────────────────

  function renderExpenses(list) {
    const el = document.getElementById('expense-list');
    if (!list.length) { el.innerHTML = '<p class="empty-state">No expenses found</p>'; return; }
    el.innerHTML = list.map(e => {
      const s = catStyle(e.category);
      return `
        <div class="expense-item">
          <span class="cat-pill" style="color:${s.color};background:${s.bg}">${e.category}</span>
          <div class="expense-info">
            <div class="expense-title">${e.title}</div>
            <div class="expense-date">${e.date}</div>
          </div>
          <div class="expense-amount">RM ${e.amount.toFixed(2)}</div>
          <button class="action-btn edit" onclick="openEdit(${e.id},'${e.title}',${e.amount},'${e.category}','${e.date}')" title="Edit">✎</button>
          <button class="action-btn del"  onclick="handleDelete(${e.id})" title="Delete">✕</button>
        </div>`;
    }).join('');
  }

  function renderSummary(summary) {
    const total = summary.reduce((s, x) => s + x.total, 0);
    document.getElementById('total-badge').textContent = `Total: RM ${total.toFixed(2)}`;
    const el = document.getElementById('summary-list');
    if (!summary.length) { el.innerHTML = '<p class="empty-state">No data</p>'; return; }
    el.innerHTML = summary.map(s => {
      const style = catStyle(s.category);
      return `<div class="summary-row">
        <span><span class="cat-dot" style="background:${style.color}"></span>${s.category}</span>
        <span class="summary-amount">RM ${s.total.toFixed(2)}</span>
      </div>`;
    }).join('');
  }

  async function refresh() {
    const [list, summary] = await Promise.all([fetchExpenses(), fetchSummary()]);
    renderExpenses(list);
    renderSummary(summary);
  }

  // ── Add ───────────────────────────────────────────────────
  document.getElementById('add-btn').addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const amount = document.getElementById('amount').value;
    const category = document.getElementById('category').value;
    const date = document.getElementById('date').value;
    if (!title || !amount || !date) { showToast('⚠️ Fill in all fields'); return; }
    await addExpense({ title, amount, category, date });
    showToast('✅ Expense added!');
    document.getElementById('title').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('date').valueAsDate = new Date();
    refresh();
  });

  // ── Delete ────────────────────────────────────────────────
  window.handleDelete = async (id) => {
    await deleteExpense(id);
    showToast('🗑️ Deleted');
    refresh();
  };

  // ── Edit modal ────────────────────────────────────────────
  window.openEdit = (id, title, amount, category, date) => {
    document.getElementById('edit-id').value       = id;
    document.getElementById('edit-title').value    = title;
    document.getElementById('edit-amount').value   = amount;
    document.getElementById('edit-category').value = category;
    document.getElementById('edit-date').value     = date;
    document.getElementById('edit-modal').classList.remove('hidden');
  };

  document.getElementById('cancel-edit-btn').addEventListener('click', () => {
    document.getElementById('edit-modal').classList.add('hidden');
  });

  document.getElementById('save-edit-btn').addEventListener('click', async () => {
    const id       = document.getElementById('edit-id').value;
    const title    = document.getElementById('edit-title').value.trim();
    const amount   = document.getElementById('edit-amount').value;
    const category = document.getElementById('edit-category').value;
    const date     = document.getElementById('edit-date').value;
    if (!title || !amount || !date) { showToast('⚠️ Fill in all fields'); return; }
    await editExpense(id, { title, amount, category, date });
    document.getElementById('edit-modal').classList.add('hidden');
    showToast('✏️ Updated!');
    refresh();
  });

  // ── Category filter buttons ───────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.cat;
      refresh();
    });
  });

  // ── Date range filter ─────────────────────────────────────
  document.getElementById('filter-btn').addEventListener('click', () => {
    activeDateFrom = document.getElementById('from-date').value;
    activeDateTo   = document.getElementById('to-date').value;
    const btn = document.getElementById('filter-btn');
    if (activeDateFrom || activeDateTo) btn.classList.add('date-active');
    refresh();
  });

  document.getElementById('clear-filter').addEventListener('click', () => {
    activeDateFrom = '';
    activeDateTo   = '';
    document.getElementById('from-date').value = '';
    document.getElementById('to-date').value   = '';
    document.getElementById('filter-btn').classList.remove('date-active');
    refresh();
  });

  // ── CSV Export ────────────────────────────────────────────
  document.getElementById('export-btn').addEventListener('click', () => {
    // Build URL with current filters so export matches what you see
    let url = `${API}/expenses/export?`;
    if (activeFilter !== 'all') url += `category=${activeFilter}&`;
    if (activeDateFrom) url += `from=${activeDateFrom}&`;
    if (activeDateTo)   url += `to=${activeDateTo}&`;

    // Opening the URL triggers the file download directly
    window.open(url, '_blank');
    showToast('⬇ Downloading CSV...');
  });

  // ── Init ──────────────────────────────────────────────────
  refresh();
</script>
</body>
</html>
