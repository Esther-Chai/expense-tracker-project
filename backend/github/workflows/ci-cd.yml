# .github/workflows/ci-cd.yml
#
# This workflow runs automatically on every push to main.
# It does 3 things in order:
#   1. Run Jest tests — if any fail, pipeline stops here
#   2. Build Docker image — confirms app containerises correctly
#   3. Deploy to Railway — only runs if tests AND build passed

name: CI/CD Pipeline

on:
  push:
    branches: [main]       # runs on every push to main
  pull_request:
    branches: [main]       # also runs on pull requests to main (tests only)

jobs:

  # ── Job 1: Test ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend   # all commands run inside /backend

    steps:
      # 1. Check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 3. Install dependencies (including devDependencies for Jest)
      - name: Install dependencies
        run: npm ci

      # 4. Run tests — pipeline stops here if any test fails
      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test_secret_for_ci   # safe dummy secret for testing
          NODE_ENV: test

  # ── Job 2: Docker build ─────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test              # only runs if 'test' job passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the Docker image to confirm it works
      # We don't push to a registry — Railway builds its own image
      - name: Build Docker image
        run: docker build -t expense-tracker ./backend

  # ── Job 3: Deploy ───────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, docker]    # only runs if BOTH test and docker passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # ↑ only deploy on direct pushes to main, not on pull requests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Railway CLI
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Deploy to Railway using a token stored in GitHub Secrets
      # To set this up:
      #   1. Go to railway.app → Account Settings → Tokens → New Token
      #   2. Copy the token
      #   3. Go to your GitHub repo → Settings → Secrets → Actions → New secret
      #   4. Name: RAILWAY_TOKEN, Value: paste your token
      - name: Deploy to Railway
        run: railway up --service expense-tracker-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}